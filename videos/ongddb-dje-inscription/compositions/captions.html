<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE caption capsule — cream pill, fully-rounded (9999px), capsule's universal 2px
     ink outline, lifted on a soft hard-offset shadow (no blur, 8% ink) */
  .caption-pill {
    max-width: 80%;
    padding: 18px 46px 20px;
    background: var(--cap-canvas, #f5f5f0);
    border: 2px solid var(--cap-ink, #1a1a1a);
    border-radius: 9999px;
    box-shadow: 8px 8px 0 color-mix(in srgb, var(--cap-ink, #1a1a1a) 8%, transparent);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.36em;
    font-family: "Poppins", Georgia, serif;
    font-weight: 700;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.16;
    letter-spacing: -0.02em;
  }

  /* upcoming — faint ink, no highlight */
  .caption-word {
    display: inline-block;
    padding: 0 0.1em;
    border-radius: 9999px;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 42%, var(--cap-canvas, #f5f5f0));
  }
  /* current word — THE rounded candy highlight: a candy fill + a box-shadow spread
     halo that follows the pill radius (a soft candy capsule around the word, no blur,
     no layout shift), ink reading on top */
  .caption-word.is-active {
    color: var(--cap-ink, #1a1a1a);
    background: var(--cap-accent, #e85d4e);
    box-shadow: 0 0 0 0.14em var(--cap-accent, #e85d4e);
  }
  /* already spoken — solid ink, candy highlight cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1a1a1a);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Bodoni Moda italic, capsule's display inflection */
  .caption-word.cap-brand {
    font-style: italic;
  }
  /* numerals / data — the Space Grotesk voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Work Sans", ui-sans-serif, sans-serif;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 72%, var(--cap-canvas, #f5f5f0));
  }
  /* emphasis — a second-candy rounded underline (the counter-accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: var(--cap-accent-2, #f2d160);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
