    var ci = Number(confs[c].getAttribute("data-i"));
    var a = angles[ci] * Math.PI / 180;
    var r = [300, 390, 250][ci % 3] - (angles[ci] > 20 ? 70 : 0);
    var tx = Math.cos(a) * r, ty = Math.sin(a) * r;
    var spin = (ci % 2 ? -1 : 1) * (160 + ci * 23);
    var t0 = STAMP + 0.08 + (ci % 4) * 0.02;
    tl.fromTo(confs[c],
      { x: 0, y: 0, scale: 0.3, rotation: ci * 26, opacity: 0 },

  tl.to($("disp"), { y: 6, duration: 0.12, ease: "power2.out" }, 1.3);

  // ---- Scene 2 (2.0–4.3): yield + envelope streaks out of the phone onto the tile ----
  tl.fromTo($("tileshadow"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.5);

  var LAUNCH = 2.84, MOVE = 0.55, EASE = "power4.out";
  var SX = 310, SY = -370;               // start offset: from inside the phone
  var UX = 0.64, UY = -0.77;             // unit vector back along the path
  // phone yields a touch (weight transfer to the envelope)
  tl.to($("phone"), { x: 22, scale: 0.97, duration: 0.6, ease: "power3.out" }, LAUNCH);
  tl.fromTo($("envelope"), { x: SX, y: SY, scale: 0.45, rotation: 18, opacity: 0, transformOrigin: "50% 50%" },
    { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: MOVE, ease: EASE }, LAUNCH);
  var ghosts = document.getElementsByClassName(ID + "-ghost");
  for (var g = 0; g < ghosts.length; g++) {

  tl.to($("envelope"), { y: -8, duration: DUR - (LAUNCH + MOVE + 0.33), ease: "sine.inOut" }, LAUNCH + MOVE + 0.33);

  // chip on « boîte mail »

    { y: 0, scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.8)" }, 4.3);

  // ---- Scene 3 (4.3–5.07): hold ----
  tl.set({}, {}, DUR);

})();
