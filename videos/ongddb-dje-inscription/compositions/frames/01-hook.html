<script>
(function () {
  var P = "01-hook-";
  function $(id) { return document.getElementById(P + id); }
  var DUR = 6.792;

  // One cue array — every reveal reads from the voiceover word cues.
  var CUE = {
    le: 0.28, dejeuner: 0.41, env: 0.73,
    trente: 1.71, place: 2.72, minute: 4.88, chrono: 6.10
  };

  var tl = gsap.timeline({ paused: true });

  // ---------- Atmosphere: leaves drift once (finite, index-derived) ----------
  for (var i = 0; i < 5; i++) {
    var dir = i % 2 === 0 ? -1 : 1;
    tl.fromTo($("leaf-" + i),
      { x: 0, y: 0, rotation: -20 + i * 14, opacity: 0.55 },
      { x: dir * (40 + i * 12), y: -(60 + i * 18), rotation: 10 + i * 9, opacity: 0.8, duration: DUR, ease: "sine.inOut" },
      0);
  }

  // Slow push-in underneath the whole shot (macro camera)
  tl.fromTo($("stage"), { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);

  // ---------- Scene 1 (0.0–1.6): logo + kicker per-word rise ----------
  tl.fromTo($("logo"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
  var words = $("label").children;
  var wordCues = [CUE.le, CUE.dejeuner, CUE.env];
  for (var w = 0; w < words.length; w++) {
    tl.fromTo(words[w],
      { y: 36, opacity: 0, filter: "blur(6px)" },
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
      wordCues[w]);
  }

  // ---------- Scene 2 (1.6–2.7): « 30 OCT. » slams (scale + blur slam) ----------
  tl.fromTo($("date"),
    { scale: 1.5, opacity: 0, filter: "blur(16px)" },
    { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
    CUE.trente - 0.06);

  // ---------- Scene 3 (2.7–4.8): island rises — shadow, tile, trees, chip ----------
  tl.fromTo($("island-shadow"),
    { scaleX: 0.2, scaleY: 0.4, opacity: 0, transformOrigin: "50% 50%" },
    { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
    CUE.place);
  tl.fromTo($("island"),
    { y: 260, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
    CUE.place + 0.1);
  tl.fromTo($("chip-place"),
    { scale: 0.4, y: 20, opacity: 0 },
    { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" },
    CUE.place + 0.25);
  var treeCues = [3.25, 3.55, 3.85];
  for (var t = 0; t < 3; t++) {
    tl.fromTo($("tree-" + t),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      treeCues[t]);
  }

  // ---------- Scene 4 (4.8–6.0): hard-cut swap chip -> « UNE MINUTE »; stopwatch lands ----------
  // Discrete state swap: instant, no tween between states.
  tl.set($("chip-place"), { opacity: 0 }, CUE.minute);
  tl.fromTo($("minute"),
    { x: -320, opacity: 0 },
    { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
    CUE.minute);
  tl.fromTo($("sw-shadow"),
    { scaleX: 0.2, scaleY: 0.4, opacity: 0, transformOrigin: "50% 50%" },
    { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
    CUE.minute - 0.04);
  tl.fromTo($("sw"),
    { y: 40, scale: 0.55, opacity: 0 },
    { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "circ.out" },
    CUE.minute + 0.06);

  // ---------- Scene 5 (6.0–6.79): « Chrono. » — hand sweeps with ticks, chip pops ----------
  tl.fromTo($("hand-min"),
    { rotation: 0 },
    { rotation: 72, duration: 0.66, ease: "steps(6)" },
    CUE.chrono);
  tl.fromTo($("hand-sec"),
    { rotation: 117 },
    { rotation: 177, duration: 0.66, ease: "none" },
    CUE.chrono);
  tl.fromTo($("sw"),
    { scale: 1.07 },
    { scale: 1, duration: 0.22, ease: "power2.out", immediateRender: false },
    CUE.chrono);
  tl.fromTo($("chip-chrono"),
    { scale: 0.4, y: 16, opacity: 0 },
    { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" },
    CUE.chrono + 0.08);

  // pad to full duration
  tl.set({}, {}, DUR);

  window.__timelines = window.__timelines || {};
  window.__timelines["01-hook"] = tl;
})();
