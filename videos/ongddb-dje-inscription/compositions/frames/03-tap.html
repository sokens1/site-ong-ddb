<script>
(function(){
  var $ = function(id){ return document.getElementById("03-tap-" + id); };
  var tl = gsap.timeline({ paused: true });

  var PHONE_S = 1.728;           // 500px phone → sketch width 864px (80cqw)
  // Button centre in world space: (606.9, 1144.7). Land it at (540, 900) on canvas.
  // Nested wrappers: T = -offset + landingShift/S
  var ZOOM_S = 1.35;
  var TX = -66.9, TY = -184.7 - 60 / ZOOM_S;

  // ── Scene 1 (0.0–1.1s): phone present, camera dives to the button, chip drops
  tl.fromTo($("phone"), { scale: PHONE_S * 0.94, y: 70, opacity: 0 },
    { scale: PHONE_S, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo($("cam-outer"), { scale: 1 }, { scale: ZOOM_S, duration: 1.0, ease: "power3.inOut" }, 0.12);
  tl.fromTo($("cam-inner"), { x: 0, y: 0 }, { x: TX, y: TY, duration: 1.0, ease: "power3.inOut" }, 0.12);
  tl.fromTo($("chip"), { y: -90, opacity: 0, scale: 0.9 },
    { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.24);

  // ── Scene 2 (1.1–1.9s): tap ring lands on « S'inscrire », press + ripple
  tl.fromTo($("tap"), { x: 150, y: 230, opacity: 0, scale: 1.15 },
    { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 0.72);
  tl.to($("ring"), { scale: 0.84, duration: 0.09, ease: "power2.in" }, 1.18);
  tl.to($("ring"), { scale: 1, duration: 0.22, ease: "power2.out" }, 1.27);
  tl.to($("btn"), { scale: 0.94, duration: 0.1, ease: "power2.in" }, 1.18);
  tl.to($("btn"), { scale: 1, duration: 0.32, ease: "power2.out" }, 1.28);
  tl.fromTo([$("ripple-1"), $("ripple-2")], { scale: 1, opacity: 0.6 },
    { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out", stagger: 0.1, immediateRender: false }, 1.2);

  // ── Scene 3 (1.9–3.16s): the green registration sheet slides up, camera eases back, holds
  tl.to($("tap"), { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" }, 1.9);
  tl.fromTo($("dim"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.95);
  tl.fromTo($("sheet"), { yPercent: 100 }, { yPercent: 0, duration: 0.75, ease: "expo.out" }, 2.0);
  tl.to($("cam-outer"), { scale: 1.12, duration: 0.95, ease: "power2.inOut" }, 2.0);
  tl.to($("cam-inner"), { x: 0, y: -201.5, duration: 0.95, ease: "power2.inOut" }, 2.0);

  // atmosphere: leaves drift once across the shot (finite, index-derived)
  for (var i = 0; i < 5; i++) {
    var dx = (i % 2 ? -1 : 1) * (60 + i * 14), dy = 90 + i * 22, rot = (i % 2 ? -1 : 1) * (25 + i * 8);
    tl.fromTo($("leaf-" + i), { x: 0, y: 0, rotation: i * 30 },
      { x: dx, y: dy, rotation: i * 30 + rot, duration: 3.161, ease: "none" }, 0);
  }

  window.__timelines = window.__timelines || {};
  window.__timelines["03-tap"] = tl;
})();
</script>
