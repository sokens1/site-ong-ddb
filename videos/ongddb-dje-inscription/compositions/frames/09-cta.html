<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // Build type-on characters (static text, deterministic)
  var lines = [$("09-cta-u1"), $("09-cta-u2")];
  var chars = [], carets = [];
  lines.forEach(function(line){
    var txt = line.getAttribute("data-text");
    line.textContent = "";
    for (var i = 0; i < txt.length; i++){
      var s = document.createElement("span");
      s.className = "09-cta-ch";
      s.textContent = txt[i];
      line.appendChild(s);
      chars.push(s);
    }
    var c = document.createElement("span");
    c.className = "09-cta-caret";
    line.appendChild(c);
    carets.push(c);
  });

  var tl = gsap.timeline({ paused: true });

  // ---- Atmosphere: leaves drift once across the frame (finite)
  [[220, -140, 40], [-240, 120, -35], [260, -180, 25], [-200, 160, -30], [240, 90, 45]].forEach(function(d, i){
    tl.fromTo($("09-cta-leaf-" + i), { x: 0, y: 0, rotation: 0 },
      { x: d[0], y: d[1], rotation: d[2], duration: 6.57, ease: "none" }, 0);
  });

  // ---- Scene 1 (0.0–1.1): island zooms out, tiles light 1 → 2 → 3, « 3 ÉTAPES » slams
  tl.fromTo($("09-cta-island"), { scale: 1.24, y: 40 }, { scale: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0);
  ["1", "2", "3"].forEach(function(n){
    tl.fromTo($("09-cta-tile-" + n), { opacity: 0.38 }, { opacity: 0.38, duration: 0.01 }, 0);
    tl.fromTo($("09-cta-glow-" + n), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo($("09-cta-badge-" + n), { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
  });
  [0.28, 0.5, 0.72].forEach(function(t, i){
    var n = i + 1;
    tl.to($("09-cta-tile-" + n), { opacity: 1, y: -14, duration: 0.3, ease: "power2.out" }, t);
    tl.to($("09-cta-glow-" + n), { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
    tl.to($("09-cta-badge-" + n), { scale: 1, opacity: 1, y: -14, duration: 0.42, ease: "back.out(2.4)" }, t + 0.06);
  });

  tl.fromTo($("09-cta-l1"), { scale: 1.7, opacity: 0, y: -30 },
    { scale: 1, opacity: 1, y: 0, duration: 0.34, ease: "power4.out" }, 0.22);

  // ---- Scene 2 (1.1–2.1): « 1 PLACE » slams under it (sun)
  tl.fromTo($("09-cta-l2"), { scale: 1.7, opacity: 0, x: -60 },
    { scale: 1, opacity: 1, x: 0, duration: 0.34, ease: "power4.out" }, 1.16);
  tl.fromTo($("09-cta-l1"), { y: 0 }, { y: -8, duration: 0.08, ease: "power2.out", immediateRender: false }, 1.4);
  tl.to($("09-cta-l1"), { y: 0, duration: 0.3, ease: "back.out(3)" }, 1.48);

  // ---- Scene 3 (2.1–4.0): CTA card rises, URL types on, chips pop, poster peeks
  tl.fromTo($("09-cta-card"), { y: 300, opacity: 0, scale: 0.94 },
    { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 2.12);
  tl.fromTo($("09-cta-label"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 2.36);
  tl.fromTo($("09-cta-poster"), { y: 160, rotation: -6, opacity: 0 },
    { y: 0, rotation: 8, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 2.42);
  tl.fromTo($("09-cta-chip-date"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(2.2)" }, 2.6);
  tl.fromTo($("09-cta-chip-place"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(2.2)" }, 2.72);

  // caret: line 1 caret visible and blinking while waiting, then typing (discrete steps)
  var typeStart = 3.0, step = 0.036;
  [2.66, 2.94].forEach(function(t, k){ tl.set(carets[0], { opacity: k % 2 === 0 ? 1 : 0 }, t); });
  tl.set(carets[0], { opacity: 1 }, typeStart);
  var line1Len = lines[0].getAttribute("data-text").length;
  chars.forEach(function(ch, i){
    tl.set(ch, { display: "inline" }, typeStart + i * step);
  });
  var line2Start = typeStart + line1Len * step;
  tl.set(carets[0], { opacity: 0 }, line2Start);
  tl.set(carets[1], { opacity: 1 }, line2Start);
  var typeEnd = typeStart + chars.length * step;
  // brief blink after typing completes, then caret off
  tl.set(carets[1], { opacity: 0 }, typeEnd + 0.12);
  tl.set(carets[1], { opacity: 1 }, typeEnd + 0.26);
  tl.set(carets[1], { opacity: 0 }, typeEnd + 0.40);

  // « ongddb.com » lands (cue 3.41): soft card pulse
